# Intégration continue : à chaque push et pull request sur main
# 1. tests     : lint (ruff) et tests unitaires, sans clé d'API ni modèle (moins d'une minute)
# 2. eval-gate : évaluation de la recherche sur le vrai index Pinecone ; échoue si le hit@3 passe sous 80 %
#                (barrière d'évaluation : une modification qui dégrade la recherche ne passe pas inaperçue)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Lancement manuel depuis l'onglet Actions de GitHub

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Installation des dépendances de test
        run: uv pip install --system -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check serveur client scripts tests
      - name: Tests unitaires (pytest)
        run: pytest -q

  eval-gate:
    needs: tests
    runs-on: ubuntu-latest
    # Uniquement sur main (les secrets ne sont pas transmis aux pull requests venant de forks)
    if: github.event_name != 'pull_request'
    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Installation (PyTorch CPU, plus léger que la version CUDA)
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r serveur/requirements.txt
      - name: Cache des modèles Hugging Face (e5 et reranker, environ 3 Go)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-e5-base-bge-reranker-v2-m3
      - name: Évaluation de la recherche (barrière hit@3 >= 80 %)
        run: python scripts/eval_retrieval.py --min-hit3 0.80
