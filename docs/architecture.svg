<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7C86"/>
    </marker>
    <!-- Icônes -->
    <symbol id="doc" viewBox="0 0 24 30">
      <path d="M2 1h13l7 7v21H2z" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M15 1v7h7" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M6 13h11M6 17h11M6 21h8" stroke="#1F2937" stroke-width="1.4"/>
    </symbol>
    <symbol id="stack" viewBox="0 0 30 34">
      <path d="M8 1h13l7 7v21H8z" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M2 5h13l7 7v21H2z" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M6 17h11M6 21h11M6 25h8" stroke="#1F2937" stroke-width="1.3"/>
    </symbol>
    <symbol id="vec" viewBox="0 0 40 34">
      <path d="M6 2H2v30h4M34 2h4v30h-4" fill="none" stroke="#1F2937" stroke-width="1.8"/>
      <g fill="#1F2937">
        <circle cx="10" cy="8" r="1.5"/><circle cx="16" cy="8" r="1.5"/><circle cx="22" cy="8" r="1.5"/><circle cx="28" cy="8" r="1.5"/><circle cx="34" cy="8" r="0"/>
        <circle cx="10" cy="14" r="1.5"/><circle cx="16" cy="14" r="1.5"/><circle cx="22" cy="14" r="1.5"/><circle cx="28" cy="14" r="1.5"/>
        <circle cx="10" cy="20" r="1.5"/><circle cx="16" cy="20" r="1.5"/><circle cx="22" cy="20" r="1.5"/><circle cx="28" cy="20" r="1.5"/>
        <circle cx="10" cy="26" r="1.5"/><circle cx="16" cy="26" r="1.5"/><circle cx="22" cy="26" r="1.5"/><circle cx="28" cy="26" r="1.5"/>
      </g>
    </symbol>
    <symbol id="users" viewBox="0 0 80 60">
      <g fill="none" stroke="#1F2937" stroke-width="3.2">
        <circle cx="22" cy="16" r="9"/><circle cx="58" cy="16" r="9"/><circle cx="40" cy="28" r="10"/>
        <path d="M6 44c0-10 7-16 16-16 3 0 6 1 8 2"/><path d="M74 44c0-10-7-16-16-16-3 0-6 1-8 2"/>
        <path d="M20 58c0-11 9-18 20-18s20 7 20 18z"/>
      </g>
    </symbol>
    <style>
      .panel { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .ptitle { font-size: 24px; font-weight: 700; font-style: italic; fill: #374151; }
      .step { font-size: 13.5px; font-style: italic; fill: #0E7C86; }
      .tech { fill: #0E7C86; }
      .techtxt { font-size: 13.5px; font-weight: 700; font-style: italic; fill: #FFFFFF; }
      .card { fill: #FFFFFF; stroke: #4B5563; stroke-width: 1.4; }
      .ch { font-size: 15px; font-weight: 700; fill: #111827; }
      .cs { font-size: 12.5px; fill: #374151; }
      .lbl { font-size: 12px; fill: #1F2937; }
      .sub { font-size: 11.5px; fill: #4B5563; }
      .ln { stroke: #1F2937; stroke-width: 1.4; fill: none; }
      .lnt { stroke: #0E7C86; stroke-width: 1.6; fill: none; }
      .dash { stroke: #6B7280; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="940" fill="#FFFFFF"/>

  <!-- ================= Bande 1 : pipeline d'indexation ================= -->
  <rect x="20" y="20" width="1360" height="390" rx="6" class="panel"/>
  <text x="44" y="392" class="ptitle">Pipeline d'indexation</text>
  <text x="1356" y="46" class="sub" text-anchor="end">hors ligne · scripts/index_corpus.py (et route /upload_pdfs protégée par jeton)</text>

  <!-- Base de connaissances -->
  <use href="#stack" x="58" y="110" width="52" height="60"/>
  <use href="#stack" x="96" y="124" width="52" height="60"/>
  <text x="104" y="210" class="ch" text-anchor="middle">Base documentaire</text>
  <text x="104" y="228" class="cs" text-anchor="middle">10 guides HAS / INCa (PDF)</text>
  <line x1="160" y1="150" x2="214" y2="150" class="ln" marker-end="url(#a)"/>

  <!-- Extraction -->
  <use href="#doc" x="222" y="126" width="34" height="44"/>
  <text x="239" y="190" class="lbl" text-anchor="middle">Pages</text>
  <text x="239" y="232" class="step" text-anchor="middle">Extraction</text>
  <text x="239" y="248" class="sub" text-anchor="middle">PyPDFLoader</text>
  <line x1="264" y1="150" x2="306" y2="150" class="ln" marker-end="url(#a)"/>

  <!-- Nettoyage -->
  <rect x="308" y="122" width="124" height="56" class="tech"/>
  <text x="370" y="147" class="techtxt" text-anchor="middle">Nettoyage</text>
  <text x="370" y="165" class="techtxt" text-anchor="middle" style="font-size:11.5px;font-weight:400">pdf_cleaning.py</text>
  <text x="370" y="196" class="sub" text-anchor="middle">en-têtes répétés, sommaires,</text>
  <text x="370" y="211" class="sub" text-anchor="middle">bibliographie, pages vides</text>
  <line x1="432" y1="150" x2="450" y2="150" class="ln"/>
  <path d="M450 150 L472 92 M450 150 L472 150 M450 150 L472 208" class="ln" marker-end="url(#a)"/>

  <!-- Découpage -->
  <use href="#doc" x="476" y="72" width="26" height="34"/>
  <use href="#doc" x="476" y="133" width="26" height="34"/>
  <use href="#doc" x="476" y="194" width="26" height="34"/>
  <text x="489" y="246" class="lbl" text-anchor="middle">Chunks</text>
  <text x="489" y="268" class="step" text-anchor="middle">Chunking</text>
  <text x="489" y="284" class="sub" text-anchor="middle">RecursiveCharacterTextSplitter</text>
  <text x="489" y="298" class="sub" text-anchor="middle">500 car. · chevauchement 100</text>
  <path d="M506 92 L530 150 M506 150 L530 150 M506 208 L530 150" class="ln"/>
  <line x1="530" y1="150" x2="572" y2="150" class="ln" marker-end="url(#a)"/>

  <!-- En-tête de contexte -->
  <rect x="574" y="122" width="150" height="56" class="tech"/>
  <text x="649" y="147" class="techtxt" text-anchor="middle">En-tête de contexte</text>
  <text x="649" y="165" class="techtxt" text-anchor="middle" style="font-size:11.5px;font-weight:400">titre du guide + chunk</text>
  <text x="649" y="196" class="sub" text-anchor="middle">data/sources.csv</text>

  <!-- Vers l'embedding -->
  <line x1="649" y1="214" x2="649" y2="356" class="ln" marker-end="url(#a)"/>
  <text x="660" y="300" class="step">Embedding</text>
  <text x="660" y="316" class="sub">préfixe « passage: »</text>

  <!-- Métadonnées -->
  <line x1="724" y1="150" x2="822" y2="150" class="ln" marker-end="url(#a)"/>
  <text x="772" y="142" class="lbl" text-anchor="middle">Métadonnées</text>
  <use href="#doc" x="826" y="128" width="32" height="40"/>
  <text x="842" y="190" class="sub" text-anchor="middle">source, page,</text>
  <text x="842" y="204" class="sub" text-anchor="middle">titre, texte</text>

  <!-- Vecteur dense (indexation) -->
  <path d="M792 372 L878 284" class="ln" marker-end="url(#a)"/>
  <use href="#vec" x="884" y="246" width="40" height="34"/>
  <text x="930" y="298" class="lbl">Vecteur dense</text>
  <text x="930" y="312" class="sub">768 dimensions</text>

  <!-- Point -> stockage -->
  <path d="M860 150 L990 206" class="ln"/>
  <path d="M926 262 L990 214" class="ln"/>
  <use href="#doc" x="994" y="188" width="30" height="38"/>
  <text x="1009" y="244" class="lbl" text-anchor="middle">Point</text>
  <text x="1009" y="258" class="sub" text-anchor="middle">id {fichier}-{n}</text>
  <text x="1080" y="196" class="step">Upsert</text>
  <path d="M1028 214 L1150 336" class="ln" marker-end="url(#a)"/>

  <!-- ================= Bande 2 : recherche + génération ================= -->
  <rect x="20" y="430" width="1360" height="490" rx="6" class="panel"/>
  <text x="44" y="470" class="ptitle">Recherche + génération</text>
  <text x="322" y="470" class="sub">en ligne · pour chaque question</text>

  <!-- Modèle d'embedding partagé (à cheval sur les deux bandes) -->
  <rect x="560" y="358" width="232" height="106" rx="4" class="card"/>
  <text x="676" y="384" class="ch" text-anchor="middle">Embedding (local)</text>
  <text x="676" y="404" class="cs" text-anchor="middle">intfloat/multilingual-e5-base</text>
  <text x="676" y="422" class="cs" text-anchor="middle">sentence-transformers</text>
  <text x="676" y="442" class="sub" text-anchor="middle">carte graphique ou CPU</text>

  <!-- Base vectorielle (à cheval) -->
  <path d="M1080 352 v118 a110 24 0 0 0 220 0 v-118" fill="#DBEFF1" stroke="#1F2937" stroke-width="1.6"/>
  <ellipse cx="1190" cy="352" rx="110" ry="24" fill="#EAF6F7" stroke="#1F2937" stroke-width="1.6"/>
  <text x="1190" y="402" class="ch" text-anchor="middle">Pinecone</text>
  <text x="1190" y="421" class="cs" text-anchor="middle">serverless · cosinus</text>
  <text x="1190" y="439" class="cs" text-anchor="middle">medibot-e5-ctx</text>
  <text x="1190" y="457" class="sub" text-anchor="middle">3 906 vecteurs</text>

  <!-- Utilisateurs -->
  <use href="#users" x="52" y="612" width="96" height="72"/>
  <text x="100" y="708" class="ch" text-anchor="middle">Utilisateurs</text>
  <line x1="152" y1="630" x2="214" y2="630" class="ln" marker-end="url(#a)"/>
  <text x="183" y="620" class="sub" text-anchor="middle">Question</text>
  <line x1="214" y1="670" x2="152" y2="670" class="lnt" marker-end="url(#at)"/>
  <text x="183" y="688" class="sub" text-anchor="middle" fill="#0E7C86">Réponse</text>

  <!-- Client Chainlit -->
  <rect x="216" y="600" width="128" height="96" rx="4" class="card"/>
  <text x="280" y="630" class="ch" text-anchor="middle">Chainlit</text>
  <text x="280" y="650" class="cs" text-anchor="middle">client/app.py</text>
  <text x="280" y="668" class="sub" text-anchor="middle">historique</text>
  <text x="280" y="683" class="sub" text-anchor="middle">sources cliquables</text>
  <line x1="344" y1="630" x2="404" y2="630" class="ln" marker-end="url(#a)"/>
  <text x="374" y="620" class="sub" text-anchor="middle">POST</text>
  <line x1="404" y1="670" x2="344" y2="670" class="lnt" marker-end="url(#at)"/>
  <text x="374" y="688" class="sub" text-anchor="middle" fill="#0E7C86">SSE</text>

  <!-- Orchestrateur -->
  <rect x="406" y="590" width="150" height="116" rx="4" class="card" stroke="#0E7C86" stroke-width="2"/>
  <text x="481" y="618" class="ch" text-anchor="middle">Orchestrateur</text>
  <text x="481" y="638" class="cs" text-anchor="middle">FastAPI</text>
  <text x="481" y="655" class="cs" text-anchor="middle">LangChain (LCEL)</text>
  <text x="481" y="674" class="sub" text-anchor="middle">/ask/stream</text>
  <text x="481" y="690" class="sub" text-anchor="middle">serveur sans état</text>

  <!-- LLM -->
  <line x1="466" y1="706" x2="466" y2="770" class="ln" marker-end="url(#a)"/>
  <line x1="496" y1="770" x2="496" y2="706" class="lnt" marker-end="url(#at)"/>
  <rect x="406" y="772" width="150" height="92" rx="4" class="card"/>
  <text x="481" y="800" class="ch" text-anchor="middle">LLM · Groq</text>
  <text x="481" y="820" class="cs" text-anchor="middle">openai/gpt-oss-120b</text>
  <text x="481" y="838" class="sub" text-anchor="middle">température 0</text>
  <text x="481" y="896" class="step" text-anchor="middle">Reformulation · Génération</text>

  <!-- Langfuse -->
  <path d="M406 690 L330 776" class="dash"/>
  <rect x="216" y="778" width="128" height="74" rx="4" class="card" stroke-dasharray="5 4"/>
  <text x="280" y="806" class="ch" text-anchor="middle">Langfuse</text>
  <text x="280" y="825" class="sub" text-anchor="middle">traces : étapes,</text>
  <text x="280" y="840" class="sub" text-anchor="middle">scores, tokens</text>
  <text x="280" y="878" class="step" text-anchor="middle">Observabilité</text>

  <!-- Question autonome -> embedding -->
  <path d="M556 610 L618 548" class="ln"/>
  <use href="#doc" x="618" y="512" width="26" height="34"/>
  <text x="652" y="560" class="sub">question (reformulée</text>
  <text x="652" y="574" class="sub">si historique)</text>
  <path d="M640 512 L656 468" class="ln" marker-end="url(#a)"/>
  <text x="704" y="500" class="step">Embedding</text>
  <text x="704" y="516" class="sub">préfixe « query: »</text>

  <!-- Vecteur de la question -> Pinecone -->
  <path d="M792 450 L866 522" class="ln" marker-end="url(#a)"/>
  <use href="#vec" x="870" y="512" width="40" height="34"/>
  <text x="890" y="564" class="lbl" text-anchor="middle">Vecteur</text>
  <text x="890" y="578" class="sub" text-anchor="middle">de la question</text>
  <path d="M914 522 L1100 478" class="ln" marker-end="url(#a)"/>
  <text x="996" y="486" class="step" text-anchor="middle">Similarité cosinus</text>

  <!-- 20 candidats -> reranker -->
  <line x1="1190" y1="496" x2="1190" y2="540" class="ln" marker-end="url(#a)"/>
  <use href="#stack" x="1176" y="544" width="30" height="34"/>
  <text x="1216" y="562" class="lbl">20 chunks</text>
  <text x="1216" y="576" class="sub">(10 sous Docker, CPU)</text>
  <line x1="1190" y1="582" x2="1190" y2="610" class="ln" marker-end="url(#a)"/>

  <rect x="1078" y="612" width="224" height="96" rx="4" class="card"/>
  <text x="1190" y="638" class="ch" text-anchor="middle">Reranker (local)</text>
  <text x="1190" y="658" class="cs" text-anchor="middle">BAAI/bge-reranker-v2-m3</text>
  <text x="1190" y="676" class="cs" text-anchor="middle">cross-encoder</text>
  <text x="1190" y="694" class="sub" text-anchor="middle">carte graphique ou CPU</text>
  <text x="1068" y="664" class="step" text-anchor="end">Reranking</text>

  <line x1="1190" y1="708" x2="1190" y2="740" class="ln" marker-end="url(#a)"/>
  <rect x="1094" y="742" width="192" height="56" class="tech"/>
  <text x="1190" y="766" class="techtxt" text-anchor="middle">Seuil de pertinence</text>
  <text x="1190" y="784" class="techtxt" text-anchor="middle" style="font-size:11.5px;font-weight:400">top 3 · score &lt; 0,03 → contexte vide</text>

  <!-- Passages voisins -->
  <line x1="1094" y1="770" x2="1036" y2="770" class="ln" marker-end="url(#a)"/>
  <rect x="876" y="742" width="158" height="56" class="tech"/>
  <text x="955" y="766" class="techtxt" text-anchor="middle">Passages voisins</text>
  <text x="955" y="784" class="techtxt" text-anchor="middle" style="font-size:11.5px;font-weight:400">{fichier}-{n ± 1} recollés</text>
  <path d="M1302 440 Q1352 456 1352 520 L1352 852 L955 852 L955 800" class="dash" marker-end="url(#a)"/>
  <text x="1150" y="874" class="sub" text-anchor="middle">lecture des voisins par identifiant (fetch)</text>

  <!-- Contexte -> orchestrateur -->
  <line x1="876" y1="770" x2="742" y2="770" class="ln" marker-end="url(#a)"/>
  <use href="#stack" x="704" y="752" width="32" height="36"/>
  <text x="720" y="808" class="lbl" text-anchor="middle">3 passages élargis</text>
  <text x="720" y="822" class="sub" text-anchor="middle">+ titre du guide</text>
  <path d="M700 768 L560 690" class="ln" marker-end="url(#a)"/>
  <text x="640" y="702" class="step" text-anchor="middle">Contexte</text>
</svg>
